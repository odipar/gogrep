name: rulesets

# Checks that each rule set archive committed in internal/rulesets holds what
# its pinned commit in opengrep.json does: on changes to the pins, the
# archives or the tool that packs them, and weekly.
on:
  push:
    branches: [main]
    paths: [opengrep.json, 'internal/rulesets/**', 'tools/**']
  pull_request:
    paths: [opengrep.json, 'internal/rulesets/**', 'tools/**']
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Fetch every pinned rule set again and compare
        run: go run ./tools/fetch-opengrep -check-rules
