name: test

# Vets and tests gogrep, then runs the example rule test fixtures with a
# bundled build, on every OS that gogrep test must give identical results on.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Check the rule-set stamps against opengrep.json
        run: go test -run '^TestStampsMatchPins$' ./internal/rulesets

      - name: Fetch the pinned opengrep for this platform
        run: go run ./tools/fetch-opengrep

      - name: Vet
        run: go vet ./... && go vet -tags gogrep_bundled ./...

      - name: Check the build tags
        # Platforms that opengrep.json pins no opengrep for still build with
        # gogrep_bundled, and the old tag fails, naming the new one.
        if: runner.os == 'Linux'
        run: |
          GOOS=freebsd GOARCH=amd64 go build -tags gogrep_bundled ./...
          GOOS=linux GOARCH=386 go build -tags gogrep_bundled ./...
          # The compiler's message is not echoed on success, so that the Go
          # problem matcher does not report it as an error.
          if out=$(go build -tags bundled ./... 2>&1) || ! grep -q gogrep_bundled <<< "$out"; then
            echo "$out"
            echo "::error::go build -tags bundled must fail naming gogrep_bundled"
            exit 1
          fi

      - name: Build gogrep with the pinned opengrep
        # A directory output adds .exe on Windows.
        run: go build -tags gogrep_bundled -o "$RUNNER_TEMP/bin/" .

      - name: Scan four times at once with a cold cache
        # opengrep unpacks its runtime on its first run, and runs that start
        # meanwhile crashed (2 of 4, SIGBUS) before gogrep prepared the
        # runtime once, privately, in its cache. Windows cannot move the
        # runtime, which this step finds cold as it runs before the tests:
        # there gogrep marks it ready instead.
        run: |
          cold="$RUNNER_TEMP/cold"
          mkdir -p "$cold"
          pids=()
          for i in 1 2 3 4; do
            HOME="$cold" XDG_CACHE_HOME="$cold" LOCALAPPDATA="$cold" \
              "$RUNNER_TEMP/bin/gogrep" scan --sarif . > "$cold/$i.sarif" 2> "$cold/$i.err" &
            pids+=($!)
          done
          failed=0
          for i in 1 2 3 4; do
            if ! wait "${pids[$((i - 1))]}" || ! grep -q '"version": *"2.1.0"' "$cold/$i.sarif"; then
              echo "::error::scan $i failed"
              cat "$cold/$i.err"
              failed=1
            fi
          done
          if [ "$RUNNER_OS" = Windows ]; then
            ready=$(find "$cold" -path '*/gogrep/runtime-*.ready')
          else
            ready=$(find "$cold" -path '*/gogrep/runtime-*/opengrep/v*' -prune)
          fi
          if [ -z "$ready" ]; then
            echo "::error::gogrep prepared no runtime in its cache"
            find "$cold" -maxdepth 4
            failed=1
          fi
          echo "prepared: $ready"
          exit $failed

      - name: Test
        run: go test -tags gogrep_bundled ./...

      - name: Run the example rule tests
        run: cd testdata/project && "$RUNNER_TEMP/bin/gogrep" test
