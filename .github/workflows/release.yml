name: release

# Pushing a v* tag builds gogrep for every platform in opengrep.json, each with
# the pinned opengrep embedded, and publishes them as a GitHub release.
# Running it by hand only builds and uploads them as a workflow artifact.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Fetch pinned opengrep binaries
        run: go run ./tools/fetch-opengrep all

      - name: Build
        run: |
          mkdir -p dist
          # Targets are GOOS/GOARCH[/variant]; a variant (musl) becomes the
          # build tag gogrep_<variant> and a suffix on the file name.
          for target in $(jq -r '.assets | keys[]' opengrep.json); do
            IFS=/ read -r os arch variant <<< "$target"
            tags=gogrep_bundled name=gogrep_${os}_${arch} ext=
            [ -n "$variant" ] && tags="$tags,gogrep_$variant" name="${name}_$variant"
            [ "$os" = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch \
              go build -tags "$tags" -trimpath -ldflags "-s -w" \
              -o "dist/$name$ext" ./cmd/gogrep
          done
          cp LICENSE NOTICE.md dist/
          (cd dist && sha256sum * > checksums.txt)
          cat dist/checksums.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes \
            --notes "Bundles opengrep $(jq -r .version opengrep.json) and the rule sets: $(jq -r '[.rules[] | "\(.repo)@\(.commit[:12])"] | join(", ")' opengrep.json). See NOTICE.md for licenses."

      - name: Upload artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gogrep
          path: dist/
